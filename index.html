<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preload" as="image" type="image/webp" href="/assets/profile/dsc-4145-cutout.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/profile/akashi.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/demo/grain.webp" />
    <link rel="preload" as="image" type="image/png" href="/assets/demo/iconpattern.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const getSystemTheme = () =>
          window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        let theme = "system"

        try {
          const storedTheme = localStorage.getItem("vite-ui-theme")

          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") {
            theme = storedTheme
          }
        } catch {
          theme = "system"
        }

        const resolvedTheme = theme === "system" ? getSystemTheme() : theme

        document.documentElement.classList.remove("light", "dark")
        document.documentElement.classList.add(resolvedTheme)
        document.documentElement.style.colorScheme = resolvedTheme
      })()
    </script>
    <title>Akashi - Homepage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
