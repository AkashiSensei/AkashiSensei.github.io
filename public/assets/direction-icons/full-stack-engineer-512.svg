<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <style>
      .panel { fill: #07111F; fill-opacity: .88; }
      .code { stroke: #E0F2FE; fill: #E0F2FE; }
      .slash { stroke: #38BDF8; }
      .server-line { fill: #ECFDF5; }
      .server-line-muted { fill: #D1FAE5; }
      .server-dot { fill: #064E3B; }
      .connection { stroke: #94A3B8; }
      .node { fill: #F8FAFC; }
      .node-blue { fill: #2563EB; }
      .node-teal { fill: #0F766E; }
      .node-green { fill: #10B981; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #0F172A; fill-opacity: .94; }
        .code { stroke: #F0FDFA; fill: #F0FDFA; }
        .slash { stroke: #67E8F9; }
        .server-line { fill: #F0FDF4; }
        .server-line-muted { fill: #BBF7D0; }
        .server-dot { fill: #052E16; }
        .connection { stroke: #64748B; }
        .node { fill: #E2E8F0; }
        .node-blue { fill: #60A5FA; }
        .node-teal { fill: #2DD4BF; }
        .node-green { fill: #34D399; }
      }
    </style>
    <linearGradient id="window" x1="140" y1="128" x2="338" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="server" x1="270" y1="206" x2="390" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <rect x="112" y="116" width="244" height="190" rx="28" fill="url(#window)"/>
    <rect class="panel" x="132" y="154" width="204" height="132" rx="14" fill="#07111F" fill-opacity=".88"/>
    <circle class="code" cx="146" cy="135" r="7" fill="#E0F2FE"/>
    <circle cx="168" cy="135" r="7" fill="#BAE6FD"/>
    <circle cx="190" cy="135" r="7" fill="#67E8F9"/>

    <path class="code" d="M190 207l-34 31 34 31" stroke="#E0F2FE" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
    <path class="code" d="M258 207l34 31-34 31" stroke="#E0F2FE" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
    <path class="slash" d="M238 193l-32 88" stroke="#38BDF8" stroke-linecap="round" stroke-width="16"/>

    <rect x="270" y="230" width="122" height="116" rx="24" fill="url(#server)"/>
    <rect class="server-line" x="294" y="257" width="74" height="14" rx="7" fill="#ECFDF5"/>
    <rect class="server-line-muted" x="294" y="286" width="50" height="14" rx="7" fill="#D1FAE5"/>
    <circle class="server-dot" cx="363" cy="294" r="8" fill="#064E3B"/>

    <path class="connection" d="M186 334h136" stroke="#94A3B8" stroke-linecap="round" stroke-width="18"/>
    <path class="connection" d="M254 306v64" stroke="#94A3B8" stroke-linecap="round" stroke-width="18"/>
    <circle class="node" cx="170" cy="334" r="24" fill="#F8FAFC"/>
    <circle class="node" cx="254" cy="386" r="24" fill="#F8FAFC"/>
    <circle class="node" cx="338" cy="334" r="24" fill="#F8FAFC"/>
    <circle class="node-blue" cx="170" cy="334" r="12" fill="#2563EB"/>
    <circle class="node-teal" cx="254" cy="386" r="12" fill="#0F766E"/>
    <circle class="node-green" cx="338" cy="334" r="12" fill="#10B981"/>
  </g>
</svg>
