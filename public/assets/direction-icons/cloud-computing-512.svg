<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <style>
      .cloud-start { stop-color: #F8FAFC; }
      .cloud-end { stop-color: #DBEAFE; }
      .cloud-outline { stroke: #93C5FD; }
      .line { stroke: #94A3B8; }
      .node { fill: #EFF6FF; }
      .node-a { fill: #2563EB; }
      .node-b { fill: #06B6D4; }
      .node-c { fill: #10B981; }
      .spark { fill: #F59E0B; }
      @media (prefers-color-scheme: dark) {
        .cloud-start { stop-color: #E0F2FE; }
        .cloud-end { stop-color: #1D4ED8; }
        .cloud-outline { stroke: #60A5FA; }
        .line { stroke: #64748B; }
        .node { fill: #E2E8F0; }
        .node-a { fill: #60A5FA; }
        .node-b { fill: #22D3EE; }
        .node-c { fill: #34D399; }
        .spark { fill: #FBBF24; }
      }
    </style>
    <linearGradient id="cloudGradient" x1="138" y1="135" x2="370" y2="319" gradientUnits="userSpaceOnUse">
      <stop class="cloud-start" stop-color="#F8FAFC"/>
      <stop class="cloud-end" offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" transform="translate(256 256) scale(1.16) translate(-256 -256)">
    <path class="cloud-outline" d="M174 296c-44 0-78-30-78-69 0-36 29-65 66-68 18-38 57-62 103-62 58 0 105 41 113 96 32 8 56 36 56 70 0 40-33 72-75 72H174z" fill="url(#cloudGradient)" stroke="#93C5FD" stroke-width="14"/>

    <path class="line" d="M176 356h160" stroke="#94A3B8" stroke-linecap="round" stroke-width="18"/>
    <path class="line" d="M256 294v92" stroke="#94A3B8" stroke-linecap="round" stroke-width="18"/>
    <path class="line" d="M198 294v62" stroke="#94A3B8" stroke-linecap="round" stroke-width="14"/>
    <path class="line" d="M314 294v62" stroke="#94A3B8" stroke-linecap="round" stroke-width="14"/>

    <circle class="node" cx="176" cy="356" r="25" fill="#EFF6FF"/>
    <circle class="node" cx="256" cy="386" r="25" fill="#EFF6FF"/>
    <circle class="node" cx="336" cy="356" r="25" fill="#EFF6FF"/>
    <circle class="node-a" cx="176" cy="356" r="12" fill="#2563EB"/>
    <circle class="node-b" cx="256" cy="386" r="12" fill="#06B6D4"/>
    <circle class="node-c" cx="336" cy="356" r="12" fill="#10B981"/>

    <path class="spark" d="M254 166l20 34 38 8-26 29 4 39-36-16-36 16 4-39-26-29 38-8 20-34z" fill="#F59E0B" fill-opacity=".9"/>
  </g>
</svg>
