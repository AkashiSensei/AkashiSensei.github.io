<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      sessionStorage.setItem(
        "spa-redirect-path",
        location.pathname + location.search + location.hash,
      )
      location.replace(location.origin + "/")
    </script>
  </head>
  <body></body>
</html>
